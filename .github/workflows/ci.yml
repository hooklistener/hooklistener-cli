name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust 1.92.0
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0
        with:
          components: rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust 1.92.0
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Run clippy (deny warnings)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: Tests (stable)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate release workflow contracts
        run: python3 scripts/release_workflow_contract_test.py
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.20.2
      - name: Verify npm packaging toolchain
        run: test "$(npm --version)" = "10.8.2"
      - name: Test npm packaging
        run: |
          node --test npm/packages/hooklistener/scripts/install.test.js npm/scripts/verify-package.test.js
          node npm/scripts/verify-package.js
      - name: Install Rust 1.92.0
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Run tests (includes insta snapshots)
        env:
          INSTA_UPDATE: new
        run: cargo test --all-targets --all-features --locked
      - name: Upload pending insta snapshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pending-insta-snapshots
          path: |
            **/*.snap.new
          if-no-files-found: ignore

  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust 1.92.0
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-audit 0.22.2
        run: cargo install cargo-audit --version 0.22.2 --locked
      # rustsec/audit-check runs `cargo generate-lockfile` before auditing, which
      # audits freshly resolved dependencies rather than the committed ones and
      # dirties Cargo.lock. Audit the checked-in lockfile directly instead.
      - name: Run cargo audit
        run: cargo audit --file Cargo.lock
      - name: Verify Cargo.lock is unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock

  machete:
    name: Unused dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust 1.92.0
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-machete 0.9.2
        run: cargo install cargo-machete --version 0.9.2 --locked
      # rustc's dead_code lint never covers dependencies; machete is the only
      # check that catches a crate left in Cargo.toml after its last use is gone.
      - name: Run cargo machete
        run: cargo machete

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [fmt, clippy, test, audit, machete]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust 1.92.0
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # rust-cache keys on runner.os, not the image. Without this, a build
          # cached on ubuntu-latest (glibc 2.39) is restored by the ubuntu-22.04
          # release build and fails to link (__isoc23_* symbols).
          key: ${{ matrix.os }}
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} --locked
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hooklistener-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/hooklistener*
          if-no-files-found: error
