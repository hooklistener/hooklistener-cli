[package]
name = "hooklistener-cli"
version = "1.8.7"
edition = "2024"
autobins = false
description = "A fast, terminal-based CLI for browsing webhooks, forwarding events, and exposing local servers"
license = "MIT"
repository = "https://github.com/hooklistener/hooklistener-cli"
homepage = "https://hooklistener.com"
readme = "README.md"
keywords = ["webhook", "cli", "tunnel", "hooklistener"]
categories = ["command-line-utilities", "development-tools", "web-programming"]
exclude = [
    ".github/",
    "docs/",
    "npm/",
    "scripts/",
    "tests/",
]

[dependencies]
# Keep the terminal backend, colors, and layout cache; omit unused macro helpers.
ratatui = { version = "^0.30.0", default-features = false, features = ["crossterm", "underline-color", "layout-cache"] }
crossterm = "0.29"
tokio = { version = "1.52", features = ["io-util", "macros", "net", "parking_lot", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
futures-util = "0.3"
# self_update already selects native TLS in Reqwest 0.13; keep that backend and
# the non-TLS defaults without also compiling the unused Rustls/AWS-LC stack.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
dirs = "6.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "ansi", "chrono"] }
tracing-appender = "0.2"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
clap_complete = "4.6"
uuid = { version = "1.23", features = ["v4", "serde"] }
base64 = "0.22"
brotli = "8.0"
encoding_rs = "0.8"
flate2 = "1.1"
thiserror = "2.0"
# Clipboard actions copy text only; do not compile image codecs.
arboard = { version = "3.6", default-features = false }
comfy-table = "7"
zstd = "0.13"
self_update = { version = "1.0.0-rc.2", default-features = false, features = ["reqwest", "native-tls", "github", "progress-bar", "checksums", "archive-tar", "archive-zip", "compression-tar-gz", "compression-zip-deflate"] }

[dev-dependencies]
insta = "1.47"
mockito = "1.7"
tempfile = "3.27"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[[bin]]
name = "hooklistener"
path = "src/main.rs"

# Reduce shipped binaries without slowing compilation with LTO or changing unwinding.
# Override with CARGO_PROFILE_RELEASE_STRIP=none when collecting symbolized profiles.
[profile.release]
strip = "symbols"

[workspace.metadata.dist]
# Configuration for cargo-dist release automation
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
installers = ["shell", "powershell"]
include = ["README.md"]
